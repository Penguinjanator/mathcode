name = "MathCodeLean"
version = "0.3.0"
keywords = ["math", "formalization"]
defaultTargets = ["MathCodeLean"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0-rc2"

[[lean_lib]]
name = "MathCodeLean"

# Theorem library mode — auto-managed
# user vault libraries. Generated mirrors live under the fixed
# `UserVaultLibs` module root so Lake can discover arbitrary vault namespaces
# without rewriting this manifest.
[[lean_lib]]
name = "UserVaultLibs"
srcDir = "VaultLibs"
globs = ["UserVaultLibs.+"]
